[project]
name = "agentpassport"
version = "1.0.0"
description = "AgentPassport backend: identity, evidence, reputation, trust decisions."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "pynacl>=1.5",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "python-json-logger>=3.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the framework idiom
    "B017",  # pytest.raises(Exception) for DB-trigger assertions
    "UP042", # str+Enum is deliberate: JSON-serializable Decision
]

[tool.ruff.lint.per-file-ignores]
"app/jobs.py" = ["BLE001"]   # jobs must never crash the process
"app/main.py" = ["BLE001"]    # top-level error envelope must catch everything
"lab/attacks.py" = ["BLE001", "E501"]
"benchmarks/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
plugins = []
