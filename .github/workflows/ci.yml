name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv venv .venv && uv pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ./.venv/bin/ruff check app tests lab benchmarks
      - name: Tests
        run: ./.venv/bin/pytest tests/ -q
      - name: Adversarial lab
        run: ./.venv/bin/python -m lab.attacks
      - name: AgentTrustBench
        run: ./.venv/bin/python -m benchmarks.agenttrustbench

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t agentpassport-api .
      - name: Compose config check
        run: docker compose config -q
